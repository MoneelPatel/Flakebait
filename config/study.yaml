# Agent, model, caps and prices for the whole study. Fixed after the pilot; every run records these values.
agent: codex-cli
codex_version: 0.163.0              # npm @openai/codex; 0.164.0 was released on Oct 23, 2026, the day we pinned
model: gpt-6-luna
reasoning_effort: medium            # Codex's default

caps:
  turns_per_phase: 30               # model calls, counted by the meter; main and L3 phases each (deviation #28)
  wall_seconds_per_run: 900         # agent time, main + L3 phases together (CI time excluded)
  usd_per_run: 1.00                 # safety stop in the meter; far above the expected $0.05-0.15
  study_stop_usd: 95.0              # no run starts once the study total reaches this ($5 left for runs in flight)
  study_budget_usd: 100.0

# OpenAI standard-tier prices, USD per 1M tokens (developers.openai.com/api/docs/pricing, read Oct 23, 2026).
# Inputs over 272K tokens are billed at the long-context rates; reasoning tokens are billed as output.
prices:
  input: 0.10
  cached_input: 0.01
  cache_write: 0.25                 # the 12-hour write price; the 30-minute price is $0.125. Usage does not say
                                    # which applied, so the higher one is charged (spend is never underestimated)
  output: 0.50
  long_context_tokens: 272000
  long_context_factor_input: 2.0    # $0.20 input, $0.02 cached
  long_context_factor_output: 1.5   # $0.75 output

# Local open-weight model arm (deviation #35): Codex CLI with gpt-oss-20b served by Ollama on the host (Apple M1
# Pro, 32 GB; OLLAMA_CONTEXT_LENGTH=65536). The run's meter forwards to it instead of the OpenAI API; calls are
# logged with their tokens at price 0. Same caps, except agent time, since the model runs ~10x slower locally.
local_arm:
  model: gpt-oss:20b
  upstream: http://host.docker.internal:11434
  wall_seconds_per_run: 3600

# Category-faithful shim (deviation #33): in the agent's own runs, OD gets a seeded random test-class order and
# runs natively (the real polluter breaks the victim when it runs first in the same JVM); NIO's test runs twice in
# the JVM, visibly, with probability p per Maven invocation. Forced modes (L3 CI, validation) still relay the
# reproduced configuration. OD tests whose polluter is in the victim's own class keep the relay (JUnit 4's
# method order within a class is fixed, so a random class order cannot put the polluter first).
shim:
  faithful_categories: [OD, NIO]

maven_output:
  condensed: true
  stack_lines_per_failure: 15
